openapi: 3.0.1
info:
  title: p4pa-organization
  description: Api and Models
  version: 0.0.1
servers:
  - url: http://localhost:8080
    description: Generated server url
paths:
  /organization/{organizationId}/apiKey:
    put:
      tags:
        - Organization
      summary: Save encrypted API keys for IO or SEND
      operationId: encryptAndSaveApiKey
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationApiKeys'
      responses:
        '200':
          description: OK
        '404':
          description: Organization Not Found
        '500':
          description: Internal Server Error
  /organization/{organizationId}/apiKey/{keyType}:
    get:
      tags:
        - Organization
      summary: Get API keys for IO or SEND
      operationId: getOrganizationApiKey
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: keyType
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OrganizationApiKeyType'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
        '404':
          description: Organization Not Found
        '500':
          description: Internal Server Error
  /brokers/apiKey/{brokerId}:
    get:
      tags:
        - Broker
      summary: Retrieve decrypted API keys for a broker
      operationId: getBrokerApiKeys
      parameters:
        - name: brokerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerApiKeys'
        '404':
          description: Not Found
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/BrokerApiKeys'
        '500':
          description: Internal Server Error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/BrokerApiKeys'
  /taxonomies/sync:
    get:
      tags:
        - Taxonomy
      summary: Sync all taxonomies
      operationId: syncTaxonomies
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: integer
        "400":
          description: Invalid request
        "500":
          description: Internal server error
components:
  schemas:
    BrokerApiKeys:
      type: object
      properties:
        syncKey:
          type: string
        acaKey:
          type: string
        gpdKey:
          type: string
    OrganizationApiKeys:
      type: object
      required:
        - keyType
        - apiKey
      properties:
        keyType:
          type: string
          enum:
            - IO
            - SEND
        apiKey:
          type: string
    OrganizationApiKeyType:
      type: string
      enum:
        - IO
        - SEND
    OrganizationErrorDTO:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - ORGANIZATION_NOT_FOUND
            - ORGANIZATION_CONFLICT
            - ORGANIZATION_BAD_REQUEST
            - ORGANIZATION_GENERIC_ERROR
        message:
          type: string
